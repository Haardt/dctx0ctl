[package]
name = "cinema"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace]

[features]
default = []
axum-http = ["dep:axum", "dep:tokio"]

[dependencies]
axum = { version = "=0.8.9", optional = true, default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.52.3", optional = true, features = ["rt", "net", "sync", "time", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
chrono = { version = "=0.4.42", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "=0.38.0", features = ["bundled"] }
url = "=2.5.7"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
