[package]
name = "dctx0-project-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
[workspace]
[lib]
path = "adapter.rs"
[[bin]]
name = "dctx0-worker"
path = "worker.rs"
[dependencies]
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
cinema = { path = "../../..", features = ["axum-http"] }
url = "=2.5.7"

reqwest = { version = "=0.12.24", default-features = false, features = ["blocking"] }
