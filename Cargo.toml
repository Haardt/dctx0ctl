[workspace]
members = ["crates/dctx0-lsp", "crates/dctx0-target-sdk", "crates/dctx0-core", "crates/dctx0-interpreter", "crates/dctx0-verification", "crates/dctx0-language", "crates/dctx0-cli", "crates/dctx0-graph", "crates/dctx0-changes", "crates/dctx0-store", "crates/dctx0-engine", "crates/dctx0-tasks", "targets/typescript", "targets/java", "targets/go", "targets/rust"]
resolver = "3"

[workspace.package]
version = "0.2.10"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
flate2 = "=1.1.9"
dctx0-lsp = { path = "crates/dctx0-lsp" }
lsp-server = "=0.7.9"
lsp-types = "=0.97.0"
crossbeam-channel = "=0.5.15"
zip = { version = "=2.4.2", default-features = false }
url = "=2.5.7"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "net", "signal"] }
rustix = { version = "=1.1.4", features = ["process"] }
dctx0-target-sdk = { path = "crates/dctx0-target-sdk" }
dctx0-core = { path = "crates/dctx0-core" }
dctx0-language = { path = "crates/dctx0-language" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["unbounded_depth", "raw_value"] }
serde_stacker = "0.1"
sha2 = "0.10"
petgraph = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
dctx0-graph = { path = "crates/dctx0-graph" }
dctx0-changes = { path = "crates/dctx0-changes" }
dctx0-store = { path = "crates/dctx0-store" }
dctx0-engine = { path = "crates/dctx0-engine" }

dctx0-tasks = { path = "crates/dctx0-tasks" }

dctx0-interpreter = { path = "crates/dctx0-interpreter" }
dctx0-verification = { path = "crates/dctx0-verification" }
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
tree-sitter = "=0.25.10"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.25.0"
tree-sitter-rust = "=0.24.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Native provenance hashes compiler/runtime images as well as small fixtures.
# Keep first-party debug/coverage code unoptimized, while avoiding extremely
# slow software SHA-256 rounds in dependency debug builds on ARM64 hosts.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
