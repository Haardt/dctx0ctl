name: Validate
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/cinema-go/go.mod
          cache-dependency-path: examples/cinema-go/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo install tree-sitter-cli --version 0.26.13 --locked
      - name: Enable bounded user scopes
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Browser acceptance
        run: |
          mkdir -p target
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9228 --user-data-dir="$RUNNER_TEMP/tutorial-browser" about:blank > "$RUNNER_TEMP/browser.log" 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:9228/json/version > /dev/null; then break; fi
            sleep 0.2
          done
          UI_SCREENSHOT=target/tutorial-ui.png bun examples/tutorial/ui-browser-check.ts > examples/tutorial/validation/browser.json
      - name: Prepare locked Cinema application dependencies
        run: |
          bun install --frozen-lockfile --cwd examples/cinema
          go -C examples/cinema-go mod download
          cargo fetch --locked --manifest-path examples/cinema-rust/.dctx0/testing/rust/Cargo.toml
      - name: Cinema agent conformance reviews
        run: |
          cargo build -p dctx0-cli --all-features --locked
          python3 scripts/conformance_review_acceptance.py
      - run: python3 scripts/validate.py --coverage --example cinema --tutorial
      - name: Gin and Axum coupled acceptance
        run: |
          cargo build --release -p dctx0-cli --all-features --locked
          python3 scripts/framework_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-acceptance
          path: target/frameworks/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-acceptance
          path: |
            examples/tutorial/validation/
            examples/tutorial-variants/validation.json
            target/tutorial-ui.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-reviews
          path: target/conformance-reviews/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-history
          path: benchmarks/history/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: target/coverage/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-harness-conformance
          path: target/native-harness-conformance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-executor-conformance
          path: target/native-executor-conformance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinema-native-coverage
          path: target/cinema-native-coverage/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-cinema-acceptance
          path: |
            target/go-cinema/
            target/go-cinema.coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-cinema-acceptance
          path: target/rust-cinema/
