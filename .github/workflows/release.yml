name: Release distribution

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/release_platform.ts'
      - 'scripts/native_portability.py'
      - 'scripts/*cinema*'
      - 'scripts/conformance_review_acceptance.py'
      - 'examples/cinema/**'
      - 'examples/cinema-go/**'
      - 'examples/cinema-rust/**'
      - 'fixtures/conformance/**'
      - '.gitattributes'
      - 'scripts/release.py'
      - 'scripts/release_acceptance.py'
      - 'scripts/release_support.py'
      - 'scripts/release_tests/**'
      - 'scripts/docs_site.py'
      - 'scripts/memory_guard.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/validate.yml'
      - 'crates/**'
      - 'targets/**'
      - 'skills/**'
      - 'editors/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/release_platform.ts'
      - 'scripts/native_portability.py'
      - 'scripts/*cinema*'
      - 'scripts/conformance_review_acceptance.py'
      - 'examples/cinema/**'
      - 'examples/cinema-go/**'
      - 'examples/cinema-rust/**'
      - 'fixtures/conformance/**'
      - '.gitattributes'
      - 'scripts/release.py'
      - 'scripts/release_acceptance.py'
      - 'scripts/release_support.py'
      - 'scripts/release_tests/**'
      - 'scripts/docs_site.py'
      - 'scripts/memory_guard.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/validate.yml'
      - 'crates/**'
      - 'targets/**'
      - 'skills/**'
      - 'editors/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A corrected, unpublished tag must supersede its obsolete failed build.
  # Different version tags still have independent concurrency groups.
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag and Cargo version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from release import validate_tag, workspace_version
          tag = os.environ['RELEASE_NAME'] if os.environ['RELEASE_REF'].startswith('refs/tags/') else 'v' + workspace_version()
          result = validate_tag(tag)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + result['tag'] + '\n')
              output.write('prerelease=' + str(result['prerelease']).lower() + '\n')
          print(json.dumps(result))
          PY

  validation:
    # v0.2.3 reuses the accepted workspace and five-host evidence below at maintainer request.
    # v0.2.4 skips new tests by explicit maintainer request; native builds/package guards remain.
    # Earlier explicitly authorized exceptions remain scoped to their original tags.
    if: startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/v0.1.0' && github.ref != 'refs/tags/v0.1.1' && github.ref != 'refs/tags/v0.2.0' && github.ref != 'refs/tags/v0.2.1' && github.ref != 'refs/tags/v0.2.2' && github.ref != 'refs/tags/v0.2.3' && github.ref != 'refs/tags/v0.2.4'
    needs: version
    uses: ./.github/workflows/validate.yml

  build:
    # Explicit release commits skip redundant branch builds; tag builds remain mandatory.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip validation]')
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            executable: dctx0
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            executable: dctx0
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            executable: dctx0
          - target: aarch64-apple-darwin
            runner: macos-14
            executable: dctx0
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            executable: dctx0.exe
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_EXECUTABLE: ${{ matrix.executable }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/cinema-go/go.mod
          cache-dependency-path: examples/cinema-go/go.sum
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Prepare native verification dependencies
        if: github.ref != 'refs/tags/v0.2.3' && github.ref != 'refs/tags/v0.2.4'
        # Launch tools directly: Git Bash prepends its Unix link.exe on Windows.
        shell: python {0}
        run: |
          import subprocess
          for command in [
              ['bun', 'install', '--frozen-lockfile', '--cwd', 'examples/cinema'],
              ['go', '-C', 'examples/cinema-go', 'mod', 'download'],
              ['cargo', 'fetch', '--locked', '--manifest-path', 'examples/cinema-rust/.dctx0/testing/rust/Cargo.toml'],
              ['rustup', 'component', 'add', 'llvm-tools-preview'],
              ['cargo', 'install', 'cargo-llvm-cov', '--locked'],
          ]:
              subprocess.run(command, check=True)
      - name: Enable bounded user scopes
        if: runner.os == 'Linux'
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Build the native release executable
        shell: python {0}
        run: |
          import os, subprocess, sys
          command = ['cargo', 'build', '--release', '--locked', '--all-features', '-p', 'dctx0-cli', '--bin', 'dctx0', '--target', os.environ['RELEASE_TARGET']]
          if sys.platform == 'linux':
              command = [sys.executable, 'scripts/memory_guard.py', *command]
          subprocess.run(command, check=True)
      - name: Test distribution and installer; measure speed and RAM
        if: needs.version.outputs.tag != 'v0.1.1' && needs.version.outputs.tag != 'v0.2.0' && needs.version.outputs.tag != 'v0.2.1' && needs.version.outputs.tag != 'v0.2.2' && needs.version.outputs.tag != 'v0.2.4'
        run: python scripts/release_acceptance.py --binary "target/$RELEASE_TARGET/release/$RELEASE_EXECUTABLE" --target "$RELEASE_TARGET" --platform-tests
      - name: Native verification, replay, Cinema completion and release time/RAM
        if: github.ref != 'refs/tags/v0.2.3' && github.ref != 'refs/tags/v0.2.4'
        shell: python {0}
        run: |
          import os, subprocess, sys
          binary = f"target/{os.environ['RELEASE_TARGET']}/release/{os.environ['RELEASE_EXECUTABLE']}"
          subprocess.run([sys.executable, 'scripts/native_portability.py', '--binary', binary, '--coverage'], check=True)
      - name: Retain native verification and platform coverage even on failure
        if: always() && github.ref != 'refs/tags/v0.2.3' && github.ref != 'refs/tags/v0.2.4'
        uses: actions/upload-artifact@v4
        with:
          name: native-verification-${{ matrix.target }}
          path: |
            target/native-portability/
            target/native-executor-conformance/
            target/native-harness-conformance/
            target/cinema-native-coverage/
            benchmarks/history/native-portability/
          if-no-files-found: error
      - name: Reject redistributable VC runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ tools not found' }
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $dependencies = & $dumpbin.FullName /DEPENDENTS "target/$env:RELEASE_TARGET/release/$env:RELEASE_EXECUTABLE" | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Executable dependency inspection failed' }
          if ($dependencies -match '(?i)(vcruntime|msvcp|concrt)[^\s]*\.dll') { throw "Dynamic VC runtime dependency found: $dependencies" }
          $dependencies | Set-Content target/windows-dependencies.txt
      - name: Package executable and release receipt
        run: python scripts/release.py package --binary "target/$RELEASE_TARGET/release/$RELEASE_EXECUTABLE" --target "$RELEASE_TARGET" --tag "$RELEASE_TAG" --output target/release-assets
      - name: Retain distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-validation-${{ matrix.target }}
          path: |
            benchmarks/history/release/
            target/release-platform.json
            target/windows-dependencies.txt
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            target/release-assets/*.tar.gz
            target/release-assets/*.zip
          if-no-files-found: error

  platform-verification:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every native matrix job
        env:
          MATRIX_RESULT: ${{ needs.build.result }}
        run: test "$MATRIX_RESULT" = success
      - uses: actions/checkout@v4
        if: github.ref == 'refs/tags/v0.2.3'
        with:
          fetch-depth: 0
      - name: Reuse accepted workspace and five-platform verification for v0.2.3
        if: github.ref == 'refs/tags/v0.2.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          evidence = json.loads(Path('docs/native-portability-native-matrix.json').read_text())
          accepted = '5d34fbc6f066c5bf251904184493b8a770c95f88'
          assert evidence['status'] == 'complete' and evidence['implementation_commit'] == accepted
          assert evidence['workflow_run'] == 38784717147
          source = evidence['runtime_source_equivalence']
          paths = source['prefixes'] + source['additional_files']
          def inventory(revision):
              return subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', revision, '--', *paths], text=True).splitlines()
          names = inventory(accepted)
          assert names == inventory('HEAD') and len(names) == source['versioned_files']
          def normalize(name, data):
              if name == 'Cargo.toml':
                  return data.replace(b'version = "0.2.3"', b'version = "0.2.2"', 1)
              if name in ('Cargo.lock', '.dctx0/testing/rust/Cargo.lock'):
                  def package(match):
                      block = match.group(0)
                      if re.search(rb'^name = "dctx0-[^"]+"$', block, re.M):
                          block = block.replace(b'\nversion = "0.2.3"', b'\nversion = "0.2.2"', 1)
                      return block
                  return re.sub(rb'\[\[package\]\][\s\S]*?(?=\[\[package\]\]|\Z)', package, data)
              return data
          digest = hashlib.sha256()
          for name in names:
              before = subprocess.check_output(['git', 'show', accepted + ':' + name])
              after = subprocess.check_output(['git', 'show', 'HEAD:' + name])
              assert before == normalize(name, after), f'Runtime input changed: {name}'
              digest.update(name.encode() + b'\0' + before)
          assert digest.hexdigest() == source['sha256']
          expected = {'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-apple-darwin', 'aarch64-apple-darwin', 'x86_64-pc-windows-msvc'}
          assert set(evidence['hosts']) == expected and not evidence['remaining_hosts']
          for target, host in evidence['hosts'].items():
              raw = Path(host['report']).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == host['report_sha256']
              report = json.loads(raw)
              assert report['status'] == 'complete' and report['metadata']['target'] == target
              assert report['metadata']['revision'] == evidence['tested_merge_commit']
              assert report['metadata']['content_hash_before'] == report['metadata']['content_hash_after']
              assert len(report['checks']) == 25
              assert all(check['exit_code'] in check['expected_exit_codes'] for check in report['checks'])
          local = json.loads(Path('docs/native-portability-linux-final.json').read_text())
          raw = Path(local['record']).read_bytes()
          assert hashlib.sha256(raw).hexdigest() == local['record_sha256']
          report = json.loads(raw)
          assert report['status'] == 'complete' and report['validation_status'] == 'pass'
          assert report['validation_source_hash'] == report['validation_source_hash_after'] == report['source_hash'] == report['source_hash_after']
          assert len(report['measurements']) == 85 and all(step['returncode'] == 0 for step in report['validation_steps'])
          assert local['coverage']['line_percent'] >= 97 and local['coverage']['llvm_totals']['functions']['percent'] >= 97
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN']} if os.environ.get('GH_TOKEN') else {}
          request = urllib.request.Request('https://api.github.com/repos/Haardt/dctx0ctl/actions/runs/38784717147', headers=headers)
          with urllib.request.urlopen(request, timeout=60) as response:
              run = json.load(response)
          assert run['conclusion'] == 'success' and run['head_sha'] == accepted
          print('Accepted full Linux validation and five native hosts reused; runtime inputs match except the package version. New binaries and installers passed all five distribution jobs.')
          PY
      - uses: actions/download-artifact@v4
        if: github.ref != 'refs/tags/v0.2.3' && github.ref != 'refs/tags/v0.2.4'
        with:
          pattern: native-verification-*
          path: target/native-evidence
      - name: Require five complete native reports
        if: github.ref != 'refs/tags/v0.2.3' && github.ref != 'refs/tags/v0.2.4'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          roots = list(Path('target/native-evidence').glob('native-verification-*'))
          expected = {'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-apple-darwin', 'aarch64-apple-darwin', 'x86_64-pc-windows-msvc'}
          assert {root.name.removeprefix('native-verification-') for root in roots} == expected, f'Missing platform jobs: {roots}'
          for root in roots:
              reports = list(root.glob('target/native-portability/*/report.json'))
              assert len(reports) == 1, f'Missing or ambiguous report: {root}'
              report = json.loads(reports[0].read_text())
              assert report['metadata']['target'] == root.name.removeprefix('native-verification-')
              assert report['status'] == 'complete', (root, report.get('failure'))
          PY

  publish:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.version.result == 'success' && needs.build.result == 'success' && needs.platform-verification.result == 'success' &&
      (needs.validation.result == 'success' ||
       ((github.ref == 'refs/tags/v0.1.0' || github.ref == 'refs/tags/v0.1.1' || github.ref == 'refs/tags/v0.2.0' || github.ref == 'refs/tags/v0.2.1' || github.ref == 'refs/tags/v0.2.2' || github.ref == 'refs/tags/v0.2.3' || github.ref == 'refs/tags/v0.2.4') && needs.validation.result == 'skipped'))
    needs: [version, validation, build, platform-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: target/release-assets
      - name: Add installer and exact checksum manifest
        run: |
          cp install.sh target/release-assets/install.sh
          cp install.ps1 target/release-assets/install.ps1
          python3 scripts/release.py checksums --directory target/release-assets --tag "$RELEASE_TAG"
      - name: Prepare installation notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GH_REPO']
          Path('target/release-notes.md').write_text(
              (Path('docs/release-v0.2.7.md').read_text() + '\n\n' if tag == 'v0.2.7' else '') +
              (Path('docs/release-v0.2.6.md').read_text() + '\n\n' if tag == 'v0.2.6' else '') +
              ('## Configurable native dependency resolution\n\nNative TypeScript dependency resolution now defaults to 10,000 references and accepts dependency_resolution.max_references from 1 through 1,000,000. Repeated exact requests use a run-local cache while every reference retains its evidence. Effective limits are pinned for replay and guarded adoption; exhaustion still preserves the prefix and blocks adoption.\n\nThe isolated Company Manager run resolved all 1,018 references with 62 cache hits and 6,246 cases PASS; manual obligations and stale reviews remain open. Existing local workspace checks and 540 Rust test executions passed. New tests, native acceptance and coverage/performance runs were stopped or skipped by explicit maintainer request for this release. Local Go race checking is unsupported on the host VMA layout and Rust debug acceptance timed out; no complete validation claim is made. All five release builds and packaging remain required. See docs/dependency-resolution-validation.json for the exact evidence and limitations.\n\n' if tag == 'v0.2.4' else '') +
              ('## Native verification on all five platforms\n\nTypeScript/Bun, Go and Rust now support verify run, replay and guarded task completion on Linux x64/ARM64, macOS Intel/Apple Silicon and Windows x64. Harnesses release resources before terminal errors. Linux retains process-tree supervision; macOS and Windows use bounded direct-child cleanup.\n\nFor v0.2.3, the maintainer requested reuse of the completed full Linux validation and native five-host acceptance rather than repeating them. The release gate checks the pinned report hashes and unchanged runtime inputs except for the package version. All five new release binaries and installers are checked with fresh time/RAM measurements. See [native acceptance](https://github.com/Haardt/dctx0ctl/actions/runs/38784717147) and the committed evidence in docs/native-portability-native-matrix.json. The separate Linux follow-up CI run was still pending when these release checks were selected.\n\n' if tag == 'v0.2.3' else '') +
              ('CI validation and distribution tests were skipped by maintainer request; local typecheck, model and browser evidence with time/RSS measurements is retained in docs/site-task-ui-validation.json. Native builds and packaging are required.\n\n## Task focus and shared Inspectors\n\nTasks open in Waves by default, with labels above filters and Markdown assignment/result details. The DAG now shares the movable, modeless architecture Inspector. Node selection stays highlighted; focus depth is controlled in the Inspector and remembered per node. Searchable task focus supports prerequisites, dependents and both directions. All task filters, including Kind, update the DAG. Result fields and artifact paths use the available panel width. Selected cards have prominent blue highlighting in both themes.\n\n' if tag == 'v0.2.2' else 'CI validation and distribution tests were skipped for v0.2.1 following the maintainer request to avoid duplicate validation. Local UI, model and browser validation evidence is retained in the repository.\n\n## Architecture focus and floating Inspector\n\nThe read-only project companion now includes searchable node focus, incoming/outgoing/both dependency directions, a depth slider and an Implementation filter that hides examples and verification nodes. Surface operations and their declaring surface/port stay visible in focused views. A narrow, movable Inspector shows node and connection details above the graph, with minimize/close controls and keyboard movement.\n\nREADME and the guide document offline export and live task views for any dctx0 project with a published spec, and include an architecture screenshot.\n\n' if tag == 'v0.2.1' else 'CI validation and distribution tests were skipped for v0.2.0 by explicit maintainer request. Existing local validation evidence is retained in the repository.\n\n## Static Site and Task Live View\n\nRead published specs, architecture, task prerequisites, changes and stored evidence in an embedded React companion. Export a portable offline site with `dctx0 site export examples/cinema/dctx0 --output target/cinema-site`, then open `index.html`. Start the local Task Live View with `dctx0 site serve examples/cinema/dctx0`; it refreshes every three seconds and preserves selection and graph positions. Both modes are read-only and require no Bun or Node.\n\n' if tag == 'v0.2.0' else 'Published without a new test run by explicit maintainer request. The CaseCli evidence-mapping fix was verified locally before the version bump.\n\n' if tag == 'v0.1.1' else 'Full workspace validation is not a publication gate for v0.1.0; platform distribution checks passed.\n\n' if tag == 'v0.1.0' else '') +
              f'## Install DCTX0 {tag}\n\n'
              f'```sh\ncurl -fsSL https://github.com/{repo}/releases/download/{tag}/install.sh | bash -s -- --version {tag}\n```\n\n'
              'Linux x86_64/ARM64 (glibc 2.35+) and macOS Intel/Apple Silicon (14+). Installs to `~/.local/bin` without sudo.\n\n'
              f'Windows x64: `irm https://github.com/{repo}/releases/download/{tag}/install.ps1 | iex`. '
              'Installs to `%LOCALAPPDATA%\\DCTX0\\bin`.\n\n'
              'The installer verifies SHA-256 and the executable version before atomic replacement. '
              'The binary includes the CLI, language server, profiles, agent skills and offline/live React companion. '
              'Native verification additionally requires Bun, Go or Rust and prepared application dependencies.\n\n'
              'Native verification, replay and guarded adoption support all five release platforms for TypeScript/Bun, Go and Rust. '
              'Native CI requires actual application success/failure, repaired replay, task/review guards and Cinema persistence/HTTP. '
              'Linux retains process-tree supervision; macOS/Windows use bounded direct-child cleanup.\n\n'
              'Archives include a source/toolchain receipt. `SHA256SUMS` covers all five archives and both installers.\n'
          )
          PY
      - name: Publish the verified tag as a GitHub Release
        run: |
          release_flags=()
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" target/release-assets/* \
            --verify-tag --title "DCTX0 $RELEASE_TAG" \
            --generate-notes --notes-file target/release-notes.md "${release_flags[@]}"
