name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'scripts/docs_site.py'
      - 'scripts/docs_site_browser.ts'
      - 'scripts/install_mdbook.py'
      - '.github/workflows/pages.yml'
      - 'crates/**'
      - 'targets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'scripts/docs_site.py'
      - 'scripts/docs_site_browser.ts'
      - 'scripts/install_mdbook.py'
      - '.github/workflows/pages.yml'
      - 'crates/**'
      - 'targets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CHROMIUM_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pinned mdBook
        run: python3 scripts/install_mdbook.py
      - name: Build specification compiler
        run: cargo build --release --locked -p dctx0-cli --bin dctx0
      - name: Build documentation (validation may be explicitly skipped)
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.event_name }}" == push && "$COMMIT_MESSAGE" == *"[skip validation]"* ]]; then
            target/docs-tools/mdbook build docs/site
          else
            python3 scripts/docs_site.py --dctx0 target/release/dctx0 --browser
          fi
      - name: Retain validation and raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-validation
          path: |
            benchmarks/history/docs-site/
            target/docs-site-desktop.png
            target/docs-site-mobile.png
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
