[book]
title = "DCTX0"
authors = ["DCTX0 contributors"]
language = "en"
src = "src"
description = "Make intent executable. Specifications, focused agent tasks, and independent verification for AI-native development."

[build]
build-dir = "../../target/docs-site"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/dctx0.css"]
additional-js = ["theme/dctx0.js"]
no-section-label = true
git-repository-url = "https://github.com/Haardt/dctx0ctl"
edit-url-template = "https://github.com/Haardt/dctx0ctl/edit/main/docs/site/{path}"
site-url = "/dctx0ctl/"
smart-punctuation = true

[output.html.search]
enable = true
use-boolean-and = true
limit-results = 20

[output.html.playground]
runnable = false

[output.html.print]
enable = false
